<div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin:0 0 14px;">
  <p class="pm-tech-italic" style="margin:0; flex:1; min-width:220px;">
    Herramienta gratuita de Pa'l Maestro · Crea pósters A5/A4/A3 (vertical u horizontal), placas reproductor y llaveros doble cara de música, películas, series o regalos con tu foto y QR personalizado.
  </p>
  <a
    href="https://shewinho.github.io/palmaestro-web/apps/pal-cuadro/"
    target="_blank"
    rel="noopener"
    class="pm-btn"
    style="display:inline-flex; align-items:center; gap:6px; background:#FFD000; color:#1F2536; padding:8px 14px; font-weight:900; font-size:12.5px; text-decoration:none; border:2.2px solid #1F2536; border-radius:10px; box-shadow:3px 3px 0 #1F2536;"
  >
    Abrir en pantalla completa ↗
  </a>
</div>

<div style="position:relative;">
  <div id="pm-palcuadro-loading" style="display:flex; justify-content:center; padding:36px 0;">
    <palmaestro-loader loop size="230" show-status></palmaestro-loader>
  </div>
  <iframe
    id="pm-palcuadro-frame"
    class="iframe-wrapper-maestro"
    src="https://shewinho.github.io/palmaestro-web/apps/pal-cuadro/"
    title="Pa´l Cuadro · Creador de Pósters, Placas y Llaveros de Pa'l Maestro"
    style="width:100%; min-height:860px; height:920px; display:none; border:2.5px solid #1F2536; border-radius:16px; background:#FFF8EE; box-shadow:5px 5px 0 #1F2536;"
    onload="document.getElementById('pm-palcuadro-loading').style.display='none'; this.style.display='block';"
    frameborder="0"
    allow="clipboard-write; web-share"
    allowfullscreen>
  </iframe>
</div>

<script>
(function(){
  var fr = document.getElementById('pm-palcuadro-frame');
  if(!fr) return;
  window.addEventListener('message', function(ev){
    if(ev.origin !== 'https://shewinho.github.io') return;
    if(ev.data && ev.data.type === 'pm-pal-cuadro-height' && ev.data.height){
      fr.style.height = Math.max(860, Math.min(2800, Number(ev.data.height) + 16)) + 'px';
    }
  });
})();
</script>
